<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect your store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="connect-page">
  <main class="panel connect-card">
    <div class="brand connect-brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V4M4 20h16M9 16v-5M13 16V8M17 16v-3"/></svg></span>
      <span class="brand-text">know your<br><strong>numbers.</strong></span>
    </div>
    <h1>Connect your store</h1>
    <p class="muted">Sign in with Shopify to see your own sales, costs and profit. Each store only ever sees its own data.</p>
    <form action="/shopify/auth" method="get" class="connect-form">
      <label>Shopify store domain<input name="shop" required placeholder="your-store.myshopify.com" pattern="[A-Za-z0-9][A-Za-z0-9\-]*(\.myshopify\.com)?" autocomplete="off"></label>
      <button class="btn primary big" type="submit">Continue with Shopify</button>
    </form>
    <p class="muted small">You'll approve read-only access on Shopify, then come straight back here.</p>
  </main>
  <script type="module" src="/connect.js"></script>
</body>
</html>
